name: Auto Blog Post

on:
  schedule:
    # UTC 기준 23:00 (한국 시간 오전 8시)
    - cron: '0 23 * * *'
    # UTC 기준 09:00 (한국 시간 오후 6시)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Python 버전을 3.11로 업그레이드

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai google-auth-oauthlib google-auth-httplib2 google-api-python-client requests

      # 수동 실행(workflow_dispatch)이 아닐 때만 0~360분(최대 6시간) 랜덤 대기
      - name: Random Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 21600))
          echo "Waiting for $DELAY seconds before posting..."
          sleep $DELAY

      - name: Run main script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python main.py
